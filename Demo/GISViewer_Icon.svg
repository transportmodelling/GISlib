    <path d="M40 176 L88 160 L128 172 L170 150 L216 160" fill="none" stroke="#E0A030" stroke-width="7" stroke-linejoin="round"/>
    <!-- Fold shading -->
    <path d="M96 52 L160 72 L160 204 L96 184 Z" fill="#000000" opacity="0.10"/>
  </g>
  <path d="M40 72 L96 52 L160 72 L216 52 L216 184 L160 204 L96 184 L40 204 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

  <!-- Location pin -->
  <path d="M150 36 C126 36 108 54 108 77 C108 108 150 148 150 148 C150 148 192 108 192 77 C192 54 174 36 150 36 Z" fill="#E5473D" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="150" cy="77" r="15" fill="#FFFFFF"/>
</svg>
